name: scd-validate-target
on:
  repository_dispatch:
    types: [deploy-review-command]
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: received
        run: |
          echo "DISPATCH RECEIVED application=$APP ARGS=$ARGS"
        env:
          APP: ${{ github.event.client_payload.slash_command.args.named.application }}
          ARGS: ${{ github.event.client_payload.slash_command.args.all }}
